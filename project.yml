name: AccCounter
options:
  bundleIdPrefix: com.lachek
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: "NO"

targets:
  AccCounter:
    type: application
    platform: iOS
    sources:
      - path: AccCounter
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lachek.acccounter
        PRODUCT_NAME: AccCounter
        INFOPLIST_FILE: AccCounter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: ""
        SUPPORTS_MACCATALYST: "NO"
